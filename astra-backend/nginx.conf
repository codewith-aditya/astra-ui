# ═══════════════════════════════════════════════════════════════════════════
#  AstraGPT — nginx reverse proxy
#
#  Terminates TLS and forwards to the Node process on 127.0.0.1:4000.
#
#  Changes from the previous configuration:
#    • TLS: the old config listened on port 80 only, so every bearer token and
#      admin secret crossed the network in plaintext. Port 80 now only redirects.
#    • client_max_body_size: nginx defaults to 1m, which rejected the 10MB image
#      and 20MB document uploads with a 413 before they ever reached Node.
#    • Security headers (HSTS, X-Frame-Options, X-Content-Type-Options, Referrer
#      Policy) are set here as well as in the app, so static assets are covered.
#    • limit_req zones on the auth and inference paths — a network-level backstop
#      in front of the application limiter.
#    • /uploads/ is served with Content-Disposition: attachment and a restrictive
#      CSP so a stored file can never execute as script in a victim's session.
#
#  Before reloading: replace the certificate paths and run `nginx -t`.
# ═══════════════════════════════════════════════════════════════════════════

# ── Allowed CORS origins ─────────────────────────────────────────────────────
# Keep in sync with ALLOWED_ORIGINS in the backend .env. The application also
# enforces this; nginx handles the preflight so OPTIONS never reaches Node.
map $http_origin $cors_origin {
    default                        "";
    "https://astragpt.in"          "$http_origin";
    "https://www.astragpt.in"      "$http_origin";
    "https://astragpt.netlify.app" "$http_origin";
    "http://localhost:5173"        "$http_origin";
    "http://localhost:4173"        "$http_origin";
}

# Upgrade header passthrough for Socket.IO.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Rate limit zones ─────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=auth_zone:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=infer_zone:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=600r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name astragpt.in www.astragpt.in;

    # Allow ACME challenges to complete over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name astragpt.in www.astragpt.in;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/astragpt.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astragpt.in/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    root  /var/www/astragpt;
    index index.html;

    # ── Request limits ───────────────────────────────────────────────────────
    # Must exceed the largest upload the app accepts (20MB documents) plus
    # multipart overhead, or nginx 413s before Node can apply its own limit.
    client_max_body_size    25m;
    client_body_buffer_size 256k;
    client_body_timeout     60s;
    client_header_timeout   30s;
    limit_conn              conn_zone 50;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(self), camera=()" always;

    server_tokens off;

    # ── React SPA ────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html must never be cached or
    # clients pin an old bundle against a new API.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── Uploaded files ───────────────────────────────────────────────────────
    # Served as downloads under a sandbox CSP. An uploaded SVG or HTML file
    # rendered inline would otherwise execute in the site's own origin.
    location /uploads/ {
        alias /home/ubuntu/astra-backend/uploads/;

        add_header Content-Disposition       "attachment" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Content-Security-Policy   "default-src 'none'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;

        # Never execute anything in the upload tree.
        location ~* \.(php|phtml|pl|py|jsp|asp|aspx|cgi|sh|html?|svg)$ {
            add_header Content-Disposition "attachment" always;
            add_header Content-Type "application/octet-stream" always;
        }

        expires 30d;
        access_log off;
    }

    # ── Shared proxy configuration ───────────────────────────────────────────
    # Note: proxy_set_header directives are not inherited once a location
    # defines its own, so each proxy block below repeats them.

    # ── Auth endpoints — tightest limit (OTP mail + credential checks) ───────
    location /api/backend/api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;

        if ($cors_origin != "") {
            add_header 'Access-Control-Allow-Origin'      "$cors_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'      "$cors_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization,Content-Type,X-Requested-With,x-admin-secret,x-request-id' always;
            add_header 'Access-Control-Max-Age'           1728000;
            add_header 'Content-Length'                   0;
            return 204;
        }

        proxy_pass         http://127.0.0.1:4000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_read_timeout 60s;
    }

    # ── Backend root proxy (strips the /api/backend prefix) ──────────────────
    location /api/backend/ {
        limit_req zone=api_zone burst=100 nodelay;

        if ($cors_origin != "") {
            add_header 'Access-Control-Allow-Origin'      "$cors_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Expose-Headers'    'Content-Length,Content-Range,X-Request-Id,Retry-After' always;
        }
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'      "$cors_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization,Content-Type,X-Requested-With,Range,x-admin-secret,x-request-id' always;
            add_header 'Access-Control-Max-Age'           1728000;
            add_header 'Content-Length'                   0;
            return 204;
        }

        proxy_pass         http://127.0.0.1:4000/;
        proxy_http_version 1.1;

        # SSE: no buffering, no caching, keep the connection open.
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
    }

    # ── Direct /api/ proxy ───────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=100 nodelay;

        if ($cors_origin != "") {
            add_header 'Access-Control-Allow-Origin'      "$cors_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Expose-Headers'    'Content-Length,X-Request-Id,Retry-After' always;
        }
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'      "$cors_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization,Content-Type,X-Requested-With,Range,x-admin-secret,x-request-id' always;
            add_header 'Access-Control-Max-Age'           1728000;
            add_header 'Content-Length'                   0;
            return 204;
        }

        proxy_pass         http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── OpenAI-compatible inference ──────────────────────────────────────────
    location /v1/ {
        limit_req zone=infer_zone burst=20 nodelay;

        if ($cors_origin != "") {
            add_header 'Access-Control-Allow-Origin'      "$cors_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'      "$cors_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization,Content-Type,x-request-id' always;
            add_header 'Access-Control-Max-Age'           1728000;
            add_header 'Content-Length'                   0;
            return 204;
        }

        proxy_pass         http://127.0.0.1:4000/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Socket.IO (WebSocket upgrade) ────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # ── Health check — local monitoring only ─────────────────────────────────
    location = /health {
        proxy_pass       http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
        access_log       off;
    }

    # Block access to dotfiles anywhere under the web root.
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Compression ──────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    # Note: gzip is intentionally not applied to text/event-stream — buffering
    # a compression window would defeat token-by-token streaming.
}
