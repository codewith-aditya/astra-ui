<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstraGPT — Service Unavailable</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --purple: #7c3aed;
            --cyan:   #06b6d4;
            --bg:     #0a0a0f;
        }

        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* ── Ambient background glow ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 30% 20%, rgba(124,58,237,0.12) 0%, transparent 70%),
                radial-gradient(ellipse 50% 35% at 70% 80%, rgba(6,182,212,0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ── Floating particles ── */
        .particles { position: fixed; inset: 0; pointer-events: none; }
        .p {
            position: absolute;
            width: 2px; height: 2px;
            border-radius: 50%;
            background: var(--purple);
            opacity: 0;
            animation: rise 7s ease-in infinite;
            bottom: -10px;
        }
        .p:nth-child(1)  { left:  8%; animation-delay: 0s;   background: var(--purple); }
        .p:nth-child(2)  { left: 18%; animation-delay: 1.1s; background: var(--cyan); }
        .p:nth-child(3)  { left: 28%; animation-delay: 2.3s; }
        .p:nth-child(4)  { left: 38%; animation-delay: 0.7s; background: var(--cyan); }
        .p:nth-child(5)  { left: 48%; animation-delay: 3.1s; }
        .p:nth-child(6)  { left: 58%; animation-delay: 1.8s; background: var(--cyan); }
        .p:nth-child(7)  { left: 68%; animation-delay: 0.4s; }
        .p:nth-child(8)  { left: 78%; animation-delay: 2.6s; background: var(--cyan); }
        .p:nth-child(9)  { left: 88%; animation-delay: 1.4s; }
        .p:nth-child(10) { left: 95%; animation-delay: 3.8s; background: var(--cyan); }

        @keyframes rise {
            0%   { opacity: 0;   transform: translateY(0) scale(1); }
            15%  { opacity: 0.7; }
            85%  { opacity: 0.2; }
            100% { opacity: 0;   transform: translateY(-100vh) scale(0.2); }
        }

        /* ── Card ── */
        .card {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 52px 44px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 24px;
            backdrop-filter: blur(24px);
            text-align: center;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 0 80px rgba(124,58,237,0.1);
            animation: cardIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(28px) scale(0.96); }
            to   { opacity: 1; transform: none; }
        }

        /* ── Orb ── */
        .orb-wrap {
            position: relative;
            width: 76px; height: 76px;
            margin-bottom: 6px;
        }
        .orb-halo {
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124,58,237,0.35) 0%, transparent 70%);
            animation: halo 3s ease-in-out infinite;
        }
        @keyframes halo {
            0%,100% { transform: scale(1);    opacity: 0.6; }
            50%      { transform: scale(1.18); opacity: 1;   }
        }
        .orb {
            position: relative;
            width: 76px; height: 76px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--purple), var(--cyan));
            display: flex; align-items: center; justify-content: center;
            font-size: 30px;
            box-shadow: 0 0 40px rgba(124,58,237,0.5);
            animation: orbPulse 4s ease-in-out infinite;
        }
        @keyframes orbPulse {
            0%,100% { box-shadow: 0 0 40px rgba(124,58,237,0.5); }
            50%      { box-shadow: 0 0 60px rgba(6,182,212,0.6);  }
        }

        /* ── Error code ── */
        .code {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.2);
            margin-bottom: -4px;
        }

        /* ── Title ── */
        .title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.4px;
            background: linear-gradient(135deg, #fff 40%, rgba(255,255,255,0.6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── Sub ── */
        .sub {
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            line-height: 1.65;
            max-width: 320px;
        }

        /* ── Status pill ── */
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 100px;
            padding: 8px 18px;
            margin-top: 4px;
        }
        .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #f59e0b;
            animation: blink 1.3s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes blink {
            0%,100% { opacity: 1; }
            50%      { opacity: 0.15; }
        }
        .status-text {
            font-size: 13px;
            color: rgba(255,255,255,0.45);
        }

        /* ── Retry button ── */
        .btn {
            margin-top: 6px;
            padding: 11px 32px;
            background: linear-gradient(135deg, var(--purple), #6d28d9);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: linear-gradient(135deg, #8b5cf6, var(--purple));
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(124,58,237,0.4);
        }
        .btn:active { transform: translateY(0); }

        /* ── Countdown ── */
        .countdown {
            font-size: 12px;
            color: rgba(255,255,255,0.25);
        }
        .countdown span { color: rgba(255,255,255,0.45); font-weight: 600; }

        /* ── Footer ── */
        .footer {
            font-size: 11px;
            color: rgba(255,255,255,0.12);
            margin-top: 10px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Particles -->
    <div class="particles">
        <div class="p"></div><div class="p"></div><div class="p"></div>
        <div class="p"></div><div class="p"></div><div class="p"></div>
        <div class="p"></div><div class="p"></div><div class="p"></div>
        <div class="p"></div>
    </div>

    <!-- Card -->
    <div class="card">

        <!-- Orb -->
        <div class="orb-wrap">
            <div class="orb-halo"></div>
            <div class="orb">✦</div>
        </div>

        <p class="code">503 · Service Unavailable</p>
        <h1 class="title">We'll be right back</h1>
        <p class="sub">
            AstraGPT is temporarily unavailable.<br />
            Our team has been notified and is working on it.
        </p>

        <!-- Status pill -->
        <div class="status">
            <div class="dot"></div>
            <span class="status-text" id="statusText">Checking service status…</span>
        </div>

        <!-- Retry countdown -->
        <p class="countdown">Auto-retry in <span id="timer">30</span>s</p>

        <!-- Manual retry -->
        <a href="javascript:location.reload()" class="btn">Retry now</a>

        <p class="footer">AstraGPT · Tantra AI Labs</p>
    </div>

    <script>
        // Countdown timer
        let t = 30
        const timerEl = document.getElementById('timer')
        const statusEl = document.getElementById('statusText')

        const interval = setInterval(() => {
            t--
            if (timerEl) timerEl.textContent = t
            if (t <= 0) {
                clearInterval(interval)
                statusEl && (statusEl.textContent = 'Retrying…')
                location.reload()
            }
        }, 1000)

        // Try to detect if server came back
        const checkAlive = async () => {
            try {
                const res = await fetch('/health', { cache: 'no-store', signal: AbortSignal.timeout(4000) })
                if (res.ok) {
                    statusEl && (statusEl.textContent = 'Back online! Redirecting…')
                    clearInterval(interval)
                    setTimeout(() => location.reload(), 800)
                }
            } catch { /* still down */ }
        }

        setInterval(checkAlive, 10000) // check every 10s quietly
        checkAlive()
    </script>
</body>
</html>
